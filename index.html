<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Void Arena</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      font-family: "Courier New", monospace; color: #7fffd4; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(0,8,12,.86); text-align: center; padding: 16px; box-sizing: border-box; overflow: auto; }
    .menu h1 { margin: 0 0 6px; letter-spacing: .3em; font-size: clamp(24px, 6vw, 48px); color: #7fffd4; text-shadow: 0 0 12px #0fa; }
    .menu h2 { margin: 4px 0; font-size: 16px; color: #9fd; }
    .menu p { margin: 2px 0; max-width: 560px; font-size: 13px; color: #8cb; }
    button { font: inherit; color: #7fffd4; background: #021a1a; border: 1px solid #2a8; padding: 10px 18px; min-width: 220px;
      cursor: pointer; letter-spacing: .1em; }
    button:hover, button:active { background: #0a3a3a; }
    button:disabled { opacity: .4; cursor: default; }
    button.sel { background: #0a4a3a; border-color: #7fffd4; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .row button { min-width: 0; }
    .hidden { display: none !important; }
    .stat { display: flex; justify-content: space-between; gap: 12px; min-width: 300px; align-items: center; }
    .stat button { min-width: 0; padding: 6px 12px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
